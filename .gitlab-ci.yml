image: node:24-bookworm-slim

stages: [test, build, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - git config --global user.name 'Dulger CI'
    - git config --global user.email 'ci@dulger.invalid'
    - npm ci --ignore-scripts
  script:
    - npm run typecheck
    - npm test

docs:build:
  stage: build
  script:
    - npm ci --prefix docs
    - npm run --prefix docs build
    - npm test --prefix docs
  artifacts:
    paths: [docs/dist/]
    expire_in: 1 week

docs:pages:
  stage: deploy
  needs: [docs:build]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - README.md
        - CHANGELOG.md
        - package.json
        - docs/**/*
        - .gitlab-ci.yml
  script:
    - test -s docs/dist/public/index.html
  pages:
    publish: docs/dist/public
